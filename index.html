<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Plumber Bros.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="256" height="240"></canvas>
    <div id="help">
      <div>
        <b>&larr; &rarr;</b> / <b>A D</b> move &nbsp;&middot;&nbsp;
        <b>Space / W / &uarr;</b> jump (hold = higher) &nbsp;&middot;&nbsp;
        <b>Shift / X</b> run &nbsp;&middot;&nbsp;
        <b>P</b> pause &nbsp;&middot;&nbsp;
        <b>Enter</b> start / restart
      </div>
    </div>
  </div>

  <script src="js/sprites.js"></script>
  <script src="js/level.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
