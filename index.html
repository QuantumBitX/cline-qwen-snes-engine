<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Plumber Bros.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="256" height="240"></canvas>
    <div id="help">
      <div>
        <b>&larr; &rarr;</b> / <b>A D</b> move &nbsp;&middot;&nbsp;
        <b>Space / W / &uarr;</b> jump (hold = higher) &nbsp;&middot;&nbsp;
        <b>Shift / X</b> run &nbsp;&middot;&nbsp;
        <b>P</b> pause &nbsp;&middot;&nbsp;
        <b>M</b> mute &nbsp;&middot;&nbsp;
        <b>Enter</b> start / restart
      </div>
    </div>
  </div>

  <!-- Single ES-module entry point; it imports sprites/level/chiptune/engine.
       Serve over HTTP (e.g. `python3 -m http.server`) — modules don't load
       from file:// in most browsers. -->
  <script type="module" src="js/game.js"></script>
</body>
</html>
